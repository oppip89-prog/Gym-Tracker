<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />

  <title>Gym Tracker v7.1 - Panca Forza 8W Standalone</title>
  <style>
:root{
  --bg:#0b0f14;--panel:#111821;--panel2:#151e29;--line:#263241;--text:#f5f7fa;--muted:#93a4b8;

  --radius:20px;--radius-sm:14px;--safe-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{padding-bottom:calc(84px + var(--safe-bottom))}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app-shell{max-width:720px;margin:0 auto;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(11,15,20,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.04)}
.topbar-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}
.icon-btn,.chip-btn,.primary-btn,.secondary-btn,.danger-btn,.set-btn,.step-btn{border:0;border-radius:14px;min-height:44px;color:var(--text)}
.icon-btn{width:44px;background:var(--panel2);font-size:20px}.chip-btn{padding:0 14px;background:var(--panel2);font-weight:700}
.primary-btn{width:100%;background:var(--accent);color:#07130a;font-weight:900;padding:14px 16px;font-size:16px}
.secondary-btn{width:100%;background:var(--panel2);border:1px solid var(--line);font-weight:800;padding:13px 16px}
.danger-btn{width:100%;background:rgba(255,123,114,.12);border:1px solid rgba(255,123,114,.28);color:var(--danger);font-weight:800;padding:13px 16px}
.content{padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}.hero{padding:18px}.hero h1{margin:0 0 6px;font-size:28px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);line-height:1.45}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:8px 2px 0}.section-title h2{font-size:17px;margin:0}.section-title span{color:var(--muted);font-size:13px}
.week-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:12px}.week-btn{border:1px solid var(--line);background:#0d131b;color:var(--muted);border-radius:12px;min-height:40px;font-weight:800}.week-btn.active{background:var(--accent);color:#07130a;border-color:var(--accent)}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.kpi{padding:10px;border-radius:14px;background:#0d131b;border:1px solid rgba(255,255,255,.05)}.kpi strong{display:block;font-size:18px}.kpi span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.workout-list{display:grid;gap:10px}.workout-card{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 16px}.workout-card h3{margin:0;font-size:18px}.workout-card p{margin:4px 0 0;color:var(--muted);font-size:13px}.workout-card .start{border:0;background:var(--accent);color:#07130a;font-weight:900;border-radius:14px;min-width:86px;min-height:48px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(88,166,255,.12);color:#8bc4ff;border:1px solid rgba(88,166,255,.2)}.badge.green{background:rgba(126,231,135,.1);color:var(--accent);border-color:rgba(126,231,135,.18)}.badge.warn{background:rgba(242,204,96,.1);color:var(--warn);border-color:rgba(242,204,96,.18)}
.next-card{display:grid;gap:12px}.next-name{font-size:30px;font-weight:900;letter-spacing:-.04em}.subtle{color:var(--muted);font-size:13px;line-height:1.45}.row{display:flex;gap:10px;align-items:center}.row.between{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.bottom-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;padding:8px 10px calc(8px + var(--safe-bottom));background:rgba(11,15,20,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.bottom-nav-inner{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav-btn{border:0;background:transparent;color:var(--muted);min-height:56px;border-radius:14px;font-size:11px;font-weight:700}.nav-btn b{display:block;font-size:20px;line-height:20px;margin-bottom:5px}.nav-btn.active{color:var(--accent);background:rgba(126,231,135,.08)}
.exercise-card{padding:0;overflow:hidden}.exercise-head{padding:15px 16px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.exercise-head h3{margin:0;font-size:17px}.exercise-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.exercise-body{border-top:1px solid var(--line);padding:14px 14px 16px;background:rgba(0,0,0,.08)}.exercise-card.done{border-color:rgba(126,231,135,.35)}.exercise-card.current{box-shadow:0 0 0 1px rgba(126,231,135,.34),var(--shadow)}
.exercise-meta{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}.meta-pill{font-size:11px;font-weight:800;padding:6px 8px;border-radius:999px;background:#0d131b;color:var(--muted);border:1px solid rgba(255,255,255,.05)}
.set-table{display:grid;gap:8px}.set-row{display:grid;grid-template-columns:42px 1fr 1fr 72px 48px;gap:7px;align-items:center}.set-row.header{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.set-label{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.num-input,.metric-select,.text-input,.notes-input,.select-input{width:100%;background:#0b1118;border:1px solid var(--line);color:var(--text);border-radius:12px;min-height:44px;padding:0 10px;font-weight:800;text-align:center;outline:none}.num-input:focus,.metric-select:focus,.text-input:focus,.notes-input:focus,.select-input:focus{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(88,166,255,.12)}.set-btn{width:48px;background:var(--accent);color:#07130a;font-size:18px;font-weight:900}.set-btn.done{background:#16311e;color:var(--accent);border:1px solid rgba(126,231,135,.28)}
.quick-weight{display:flex;gap:7px;margin:8px 0 2px}.step-btn{background:#0d131b;border:1px solid var(--line);color:var(--muted);min-height:36px;padding:0 10px;font-size:12px;font-weight:800}.step-btn:active{transform:scale(.97)}
.notes-input{min-height:76px;text-align:left;padding:10px;resize:vertical;font-weight:600}.mini-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mini-actions button{min-height:42px;border-radius:12px;border:1px solid var(--line);background:#0d131b;color:var(--muted);font-weight:800}
.warmup-box{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.warmup-box button{border:0;border-radius:12px;background:var(--accent);color:#07130a;font-weight:900;min-height:44px;padding:0 14px}
.progress-shell{height:8px;background:#111a24;border-radius:999px;overflow:hidden}.progress-bar{height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease}.session-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.session-kpis .kpi{text-align:center}
.timer-dock{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(82px + var(--safe-bottom));width:min(680px,calc(100% - 24px));background:#101822;border:1px solid rgba(126,231,135,.3);box-shadow:0 18px 48px rgba(0,0,0,.45);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.timer-dock.hidden{display:none}.timer-time{font-size:30px;font-weight:900;letter-spacing:-.04em}.timer-label{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800}.timer-actions{display:flex;gap:7px}.timer-actions button{border:1px solid var(--line);background:#0b1118;color:var(--text);border-radius:12px;min-height:42px;padding:0 11px;font-weight:800}
.toast{position:fixed;z-index:60;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);opacity:0;background:#182330;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:11px 14px;box-shadow:var(--shadow);transition:.25s ease;max-width:calc(100% - 32px);font-size:13px;font-weight:700}.toast.show{transform:translate(-50%,0);opacity:1}
.history-card{display:grid;gap:10px}.history-card h3{margin:0;font-size:17px}.history-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}.history-exercises{display:grid;gap:5px;font-size:12px;color:#c7d1dd}.history-exercises span{color:var(--muted)}
.chart-wrap{height:230px;background:#0d131b;border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:8px;margin-top:10px}.chart-wrap canvas{width:100%;height:100%}.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat-card{background:#0d131b;border:1px solid rgba(255,255,255,.05);border-radius:15px;padding:12px}.stat-card strong{display:block;font-size:21px}.stat-card span{font-size:11px;color:var(--muted)}
.setting-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.05)}.setting-row:last-child{border-bottom:0}.setting-row h4{margin:0 0 3px;font-size:14px}.setting-row p{margin:0;color:var(--muted);font-size:12px}.toggle{width:52px;height:30px;border-radius:999px;border:1px solid var(--line);background:#0d131b;padding:3px}.toggle i{display:block;width:22px;height:22px;background:#718096;border-radius:50%;transition:.2s}.toggle.on{background:rgba(126,231,135,.16);border-color:rgba(126,231,135,.32)}.toggle.on i{transform:translateX(20px);background:var(--accent)}
.install-banner{background:linear-gradient(135deg,rgba(88,166,255,.13),rgba(126,231,135,.09));border:1px solid rgba(88,166,255,.2)}
.modal-backdrop{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;padding:16px}.modal{width:min(720px,100%);max-height:82vh;overflow:auto;background:#111821;border:1px solid var(--line);border-radius:24px 24px 18px 18px;padding:16px;box-shadow:0 20px 80px rgba(0,0,0,.6)}.modal h2{margin:0 0 12px}.modal-list{display:grid;gap:8px}.modal-option{border:1px solid var(--line);background:#0d131b;color:var(--text);border-radius:14px;padding:13px;text-align:left;font-weight:800}.modal-option small{display:block;color:var(--muted);font-weight:600;margin-top:4px}
.empty{text-align:center;padding:34px 14px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:7px}
hr.sep{border:0;border-top:1px solid rgba(255,255,255,.06);margin:14px 0}.codeish{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.green{color:var(--accent)}.warn{color:var(--warn)}.danger{color:var(--danger)}
@media(max-width:430px){.content{padding:12px}.card{padding:14px}.set-row{grid-template-columns:38px 1fr 1fr 66px 46px;gap:5px}.num-input,.metric-select{padding:0 5px}.hero h1{font-size:25px}.week-grid{grid-template-columns:repeat(4,1fr);gap:4px}.week-btn{min-height:38px}.kpi-grid{gap:6px}.kpi{padding:9px 7px}.session-kpis{gap:6px}}
@media(display-mode:standalone){.install-only-browser{display:none!important}}

/* Dashboard, sessione e analisi */
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.stat-grid.three{grid-template-columns:repeat(3,1fr)}
.calendar-strip{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin:14px 0 10px}
.calendar-day{display:block;aspect-ratio:1;border-radius:4px;background:#0d131b;border:1px solid rgba(255,255,255,.05)}
.calendar-day.level-1{background:rgba(126,231,135,.28);border-color:rgba(126,231,135,.25)}
.calendar-day.level-2{background:rgba(126,231,135,.58);border-color:rgba(126,231,135,.38)}
.calendar-day.level-3{background:var(--accent);border-color:var(--accent)}
.workout-inline-start{margin-top:12px}
.undo-btn{width:100%;margin-top:10px;min-height:40px;border:1px solid rgba(242,204,96,.24);background:rgba(242,204,96,.08);color:var(--warn);border-radius:12px;font-weight:800}
.protocol-card{padding:11px;margin-bottom:10px}
.suggestion-box{padding:10px 11px;margin-bottom:10px;border-radius:12px;background:rgba(126,231,135,.06);border:1px solid rgba(126,231,135,.12);font-size:12px;color:var(--muted)}
.previous-box{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:10px;padding:10px 11px;border:1px solid var(--line);background:#0d131b;border-radius:13px}
.previous-box button,.series-actions button{min-height:38px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;font-weight:800;padding:0 12px}
.series-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.set-row.no-metric{grid-template-columns:42px 1fr 1fr 48px}
.summary-title{margin:0 0 12px}
.session-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.session-summary-grid label>span{display:block;color:var(--muted);font-size:11px;font-weight:800;margin:0 0 6px 2px}
.input-suffix{position:relative}.input-suffix .text-input{padding-right:38px}.input-suffix i{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);font-style:normal;font-weight:800}
.history-filter-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:8px;margin-top:12px}.history-filter-grid .text-input{text-align:left}
.history-card.hidden-filter{display:none}
.history-note,.session-note{padding:9px 11px;border-radius:12px;background:#0d131b;color:#c7d1dd;font-size:12px;line-height:1.45;border:1px solid rgba(255,255,255,.05)}
.session-note{margin:10px 0 12px}
.segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:4px;margin:10px 0;background:#0d131b;border:1px solid var(--line);border-radius:14px}
.segmented button{min-height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:800}
.segmented button.active{background:var(--panel2);color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.2)}
.app-version{text-align:center;color:var(--muted);font-size:11px;padding:2px 0 8px}
@media(max-width:430px){.history-filter-grid{grid-template-columns:1fr}.session-summary-grid{grid-template-columns:1fr 1fr}.stat-grid.three{grid-template-columns:repeat(3,1fr)}.calendar-strip{gap:4px}.previous-box{grid-template-columns:1fr}.previous-box button{width:100%}.quick-weight{display:grid;grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* V7: portabilita, libreria schede e smart-load */
.load-preview{display:grid;gap:7px;padding:11px;border-radius:14px;background:#0d131b;border:1px solid rgba(255,255,255,.06)}
.load-preview-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:900}
.load-preview-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:7px 0;border-top:1px solid rgba(255,255,255,.04)}
.load-preview-row:first-of-type{border-top:0}.load-preview-row b{display:block;font-size:13px}.load-preview-row small{display:block;color:var(--muted);font-size:10px;margin-top:2px;line-height:1.35}.load-value{font-weight:900;color:var(--accent);white-space:nowrap}
.suggestion-box{display:grid;gap:5px}.suggestion-box.up{border-color:rgba(126,231,135,.24);background:rgba(126,231,135,.07)}.suggestion-box.down{border-color:rgba(242,204,96,.28);background:rgba(242,204,96,.07)}.suggestion-box.recalc{border-color:rgba(88,166,255,.26);background:rgba(88,166,255,.07)}.suggestion-box.hold{border-color:rgba(147,164,184,.18);background:rgba(147,164,184,.05)}
.suggestion-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.suggestion-top b{color:var(--text);font-size:14px}.suggestion-box small{display:block;color:var(--muted);line-height:1.4}
.action-stack{display:grid;gap:8px;margin-top:12px}
.program-library{display:grid;gap:8px;margin-top:12px}.program-library-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);background:#0d131b;border-radius:13px}.program-library-row b{display:block;font-size:13px}.program-library-row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.program-library-row>div:last-child{display:flex;gap:6px}.program-library-row button{min-height:36px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;font-weight:800;padding:0 11px}.program-library-row .danger-mini{color:var(--danger);min-width:36px;padding:0}
.data-status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.data-status span{display:block;text-align:center;padding:11px 8px;border-radius:13px;background:#0d131b;border:1px solid rgba(255,255,255,.05)}.data-status b{display:block;font-size:18px}.data-status small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.empty.compact{padding:20px 10px}.empty.compact b{font-size:14px}.history-actions{display:flex;gap:6px}.history-suggestion{margin-top:8px;padding:7px 9px;border-radius:10px;background:rgba(88,166,255,.07);border:1px solid rgba(88,166,255,.16);font-size:11px;color:#b8d8ff}
@media(max-width:430px){.load-preview-row{grid-template-columns:1fr auto}.program-library-row{grid-template-columns:1fr}.program-library-row>div:last-child button:first-child{flex:1}.data-status{grid-template-columns:repeat(3,1fr)}}

/* v7 - ciclo panca 8 settimane */
.bridge-card{border-color:rgba(242,204,96,.24);background:linear-gradient(135deg,rgba(242,204,96,.08),rgba(88,166,255,.06))}
.bridge-actions{margin-top:12px;justify-content:flex-end;flex-wrap:wrap}
.bridge-actions .chip-btn{border:1px solid var(--line)}

/* v7.1 - progressione, step personalizzati e dashboard panca */
.segmented{grid-template-columns:repeat(auto-fit,minmax(82px,1fr))}
.week-advance-card{border-color:rgba(126,231,135,.28);background:linear-gradient(135deg,rgba(126,231,135,.10),rgba(88,166,255,.07))}
.week-advance-card h3{margin:12px 0 6px;font-size:19px}
.week-advance-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.bench-dashboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.bench-dashboard>div{background:#0d131b;border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:11px;min-width:0}
.bench-dashboard span{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
.bench-dashboard strong{display:block;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.bench-speed-list{margin-top:10px;padding:10px;border:1px solid rgba(88,166,255,.16);background:rgba(88,166,255,.05);border-radius:13px}
.bench-speed-list>b{display:block;font-size:12px;margin-bottom:8px}
.bench-speed-list label{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:8px;align-items:center;margin-top:7px}
.bench-speed-list label span{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bench-speed-list .select-input{min-height:38px;font-size:12px}
.load-step-list{display:grid;gap:0;margin-top:10px}
.load-step-row{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.load-step-row:last-child{border-bottom:0}
.load-step-row b{display:block;font-size:13px}
.load-step-row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.load-step-control{display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center}
.load-step-control .num-input{min-height:38px}
.load-step-control button{width:34px;height:34px;border:1px solid var(--line);background:#0d131b;color:var(--muted);border-radius:10px;font-weight:900}
@media(max-width:430px){.week-advance-actions{grid-template-columns:1fr}.bench-dashboard{grid-template-columns:1fr 1fr}.bench-speed-list label{grid-template-columns:1fr 112px}.load-step-row{grid-template-columns:minmax(0,1fr) 105px}}

</style>
</head>
<body>
  <div id="app"></div>

function benchGlobalData(){const pts=[];for(const sess of [...state.history].reverse()){for(const ex of sess.exercises||[]){if(!isBenchExercise(ex))continue;const done=(ex.sets||[]).filter(st=>st.done&&Number(st.kg)>0&&Number(st.reps)>0);if(!done.length)continue;let bestKg=0,bestE=0,volume=0,top=null;for(const st of done){const kg=Number(st.kg)||0,reps=Number(st.reps)||0,rir=rirEquivalent(st)||0;bestKg=Math.max(bestKg,kg);volume+=kg*reps;if(reps<=12)bestE=Math.max(bestE,kg*(1+(reps+rir)/30));if(reps===1&&(!top||kg>Number(top.kg)))top=st;}pts.push({date:sess.startedAt,kg:bestKg,e1rm:bestE,volume:Math.round(volume),rpe:top&&String(top.metric||'').toUpperCase()==='RPE'?Number(top.metricValue)||0:0,speed:top?.barSpeed||'',speedScore:benchSpeedScore(top?.barSpeed),workout:sess.workout,variant:ex.special==='bench_upper'?'B · fermo':ex.special==='bench_push'?'A · principale':ex.name});}}return pts;}
function benchSummary(data){const singles=data.filter(x=>x.rpe>0),last=singles[singles.length-1],bestE=data.length?Math.max(...data.map(x=>x.e1rm||0)):0;let sameLoad='';if(last){const prior=[...singles].reverse().find((x,i)=>i>0&&Math.abs((x.kg||0)-(last.kg||0))<.01);if(prior)sameLoad=`${fmtKg(last.kg)} kg: RPE ${prior.rpe} → ${last.rpe}`;}return{last,bestE,sameLoad,exposures:data.length,lastSpeed:last?.speed||''};}

function suggestionModeLabel(mode){ return mode==='increase'?'PROGRESSIONE':mode==='decrease'?'RIDUCI FATICA':mode==='recalc'?'RICALCOLO':mode==='initial'?'PARTENZA':'MANTIENI'; }

  c+=`<section class="card"><button class="primary-btn" onclick="finishWorkout()">Termina e salva allenamento</button><button class="danger-btn" style="margin-top:8px" onclick="discardWorkout()">Scarta sessione</button></section>`;
  return shell(c,ss.workout,`settimana ${ss.week} · sessione attiva`);
}
function benchTargetText(type,w){const pre=currentPreCycleStep();if(pre)return pre.target||'';const p=activeProgram().benchPlan?.[w-1];return type==='bench_push'?`${p?.pushTop||''} + ${p?.pushBackoff||''}`:`${p?.upperWork||''}`;}

function renderHistory(){
  const workouts=['ALL',...new Set(state.history.map(s=>s.workout).filter(Boolean))];if(!workouts.includes(state.ui.historyWorkout))state.ui.historyWorkout='ALL';
  const base=state.history.filter(s=>state.ui.historyWorkout==='ALL'||s.workout===state.ui.historyWorkout);
  let c=`<section class="card"><div class="row between"><div><h2 style="margin:0">Storico</h2><div class="subtle"><span id="historyVisibleCount">${base.length}</span> di ${state.history.length} allenamenti</div></div><div class="history-actions"><button class="chip-btn" onclick="triggerCSVImport()">Importa</button><button class="chip-btn" onclick="exportCSV()">CSV</button></div></div><div class="history-filter-grid"><input class="text-input" value="${esc(state.ui.historyQuery||'')}" oninput="filterHistoryCards(this.value)" placeholder="Cerca esercizio, workout, note…" aria-label="Cerca nello storico"><select class="select-input" onchange="setHistoryWorkout(this.value)" aria-label="Filtra workout">${workouts.map(w=>`<option value="${esc(w)}" ${state.ui.historyWorkout===w?'selected':''}>${w==='ALL'?'Tutti i workout':esc(w)}</option>`).join('')}</select></div></section>`;
  if(!state.history.length)c+=`<div class="empty"><b>Nessun allenamento ancora</b>Le sessioni concluse compariranno qui.</div>`;
  else if(!base.length)c+=`<div class="empty"><b>Nessuna sessione nel filtro</b>Scegli un altro workout.</div>`;
  else c+=base.map(s=>{const search=cleanKey([s.workout,s.notes,...(s.exercises||[]).flatMap(e=>[e.name,e.notes])].join(' '));return `<section class="card history-card" data-search="${esc(search)}" onclick="showHistoryDetail(decodeURIComponent('${encodedArg(s.id)}'))"><div class="row between"><h3>${esc(s.workout)} · ${s.preCycleStepAtStart!==null&&s.preCycleStepAtStart!==undefined?`PONTE ${Number(s.preCycleStepAtStart)+1}`:`W${s.week}`}</h3><span class="badge ${s.progress===100?'green':'warn'}">${s.progress||0}%</span></div><div class="history-meta"><span>${fmtDate(s.startedAt)}</span><span>· ${s.durationMin||'—'} min</span><span>· ${s.volume||0} kg volume</span>${s.sessionRpe?`<span>· RPE ${s.sessionRpe}</span>`:''}</div>${s.notes?`<div class="history-note">${esc(s.notes)}</div>`:''}<div class="history-exercises">${(s.exercises||[]).filter(e=>(e.sets||[]).some(x=>x.done)).slice(0,4).map(e=>`<div>${esc(e.name)} <span>· ${(e.sets||[]).filter(x=>x.done).map(x=>`${x.kg||'—'}×${x.reps}`).join(' / ')}</span></div>`).join('')}</div></section>`}).join('');
  setTimeout(()=>filterHistoryCards(state.ui.historyQuery||''),0);return shell(c,'Storico','sessioni e dati');
}
function allExerciseNames(){ const set=new Set(); let hasBench=false; Object.values(activeProgram().workouts||{}).forEach(w=>w.exercises.forEach(raw=>{const e=ensureExerciseIdentity(raw);if(e.sets||e.special)set.add(e.name);if(isBenchExercise(e))hasBench=true;})); state.history.forEach(sess=>(sess.exercises||[]).forEach(e=>{set.add(e.name);if(isBenchExercise(e))hasBench=true;})); const names=[...set].sort((a,b)=>a.localeCompare(b,'it'));if(hasBench)names.unshift(BENCH_GLOBAL_NAME);return names; }
function progressData(name){
  if(name===BENCH_GLOBAL_NAME)return benchGlobalData();
  const target=findProgramExercise(name)||name, assisted=typeof target==='object'&&isLowerHarder(target), pts=[];
  for(const sess of [...state.history].reverse()){const ex=(sess.exercises||[]).find(e=>historyExerciseMatches(e,target));if(!ex)continue;let bestKg=assisted?Infinity:0,bestE=0,volume=0;for(const st of ex.sets||[]){if(!st.done)continue;const kg=Number(st.kg)||0,reps=Number(st.reps)||0;if(kg>0)bestKg=assisted?Math.min(bestKg,kg):Math.max(bestKg,kg);volume+=kg*reps;if(!assisted&&reps>0&&reps<=12)bestE=Math.max(bestE,kg*(1+reps/30));}if(Number.isFinite(bestKg)&&bestKg>0||volume)pts.push({date:sess.startedAt,kg:Number.isFinite(bestKg)?bestKg:0,e1rm:bestE,volume:Math.round(volume)});} return pts;
}
function setProgressExercise(name){ state.ui.progressExercise=name;saveState();render(); }
function renderProgress(){
  const names=allExerciseNames(); if(!names.includes(state.ui.progressExercise))state.ui.progressExercise=names[0]||'';
  const name=state.ui.progressExercise,isBench=name===BENCH_GLOBAL_NAME,target=findProgramExercise(name)||name,targetEx=typeof target==='object'?target:null,assisted=targetEx?isLowerHarder(targetEx):isLowerHarder({name});let metric=state.ui.progressMetric||'e1rm';if(assisted&&(metric==='e1rm'||metric==='rpe'))metric='kg';if(!isBench&&metric==='rpe')metric='e1rm';state.ui.progressMetric=metric;
  const data=progressData(name),kgVals=data.map(x=>x.kg).filter(v=>v>0),bestKg=kgVals.length?(assisted?Math.min(...kgVals):Math.max(...kgVals)):0,bestE=!assisted&&data.length?Math.max(...data.map(x=>x.e1rm||0)):0,bestVol=data.length?Math.max(...data.map(x=>x.volume||0)):0;
  let totalSets=0;if(isBench)state.history.forEach(sess=>(sess.exercises||[]).filter(isBenchExercise).forEach(e=>totalSets+=(e.sets||[]).filter(x=>x.done).length));else state.history.forEach(sess=>(sess.exercises||[]).filter(e=>historyExerciseMatches(e,target)).forEach(e=>totalSets+=(e.sets||[]).filter(x=>x.done).length));
  const vals=data.map(x=>progressMetricValue(x,metric)).filter(v=>v>0),first=vals[0]||0,last=vals[vals.length-1]||0,trend=first&&vals.length>1?((assisted&&metric==='kg')||metric==='rpe'?(first-last)/first*100:(last-first)/first*100):null;
  const suggestion=targetEx&&!targetEx.special?suggestedLoad(targetEx):null, bench=isBench?benchSummary(data):null;
  let c=`<section class="card"><h2 style="margin-top:0">Progressi</h2><select class="select-input" onchange="setProgressExercise(this.value)">${names.map(n=>`<option ${n===name?'selected':''}>${esc(n)}</option>`).join('')}</select>${isBench?`<div class="bench-dashboard"><div><span>Ultima singola</span><strong>${bench?.last?`${fmtKg(bench.last.kg)} kg @RPE ${bench.last.rpe}`:'—'}</strong></div><div><span>e1RM RPE-adjusted</span><strong>${bench?.bestE?`${fmtKg(bench.bestE)} kg`:'—'}</strong></div><div><span>Confronto stesso carico</span><strong>${esc(bench?.sameLoad||'servono due singole comparabili')}</strong></div><div><span>Velocità ultima singola</span><strong>${benchSpeedLabel(bench?.lastSpeed)}</strong></div><div><span>Esposizioni registrate</span><strong>${bench?.exposures||0}</strong></div></div>`:''}<div class="segmented" role="group" aria-label="Metrica grafico">${!assisted?`<button class="${metric==='e1rm'?'active':''}" onclick="setProgressMetric('e1rm')">e1RM</button>`:''}<button class="${metric==='kg'?'active':''}" onclick="setProgressMetric('kg')">${assisted?'Assistenza':'Carico'}</button><button class="${metric==='volume'?'active':''}" onclick="setProgressMetric('volume')">Volume</button>${isBench?`<button class="${metric==='rpe'?'active':''}" onclick="setProgressMetric('rpe')">RPE singola</button>`:''}</div><div class="stat-grid"><div class="stat-card"><strong>${bestKg?fmtKg(bestKg)+' kg':'—'}</strong><span>${assisted?'migliore assistenza (meno = meglio)':'miglior carico'}</span></div><div class="stat-card"><strong>${bestE?fmtKg(bestE)+' kg':'—'}</strong><span>${assisted?'e1RM non applicabile':'miglior e1RM'}</span></div><div class="stat-card"><strong>${bestVol?fmtKg(bestVol)+' kg':'—'}</strong><span>miglior volume seduta</span></div><div class="stat-card"><strong>${trend===null?'—':`${trend>=0?'+':''}${trend.toFixed(1)}%`}</strong><span>trend ${progressMetricLabel(metric,assisted)}</span></div></div>${suggestion?`<div class="suggestion-box ${suggestionModeClass(suggestion.mode)}"><div class="suggestion-top"><span class="badge">PROSSIMA VOLTA</span><b>${fmtKg(suggestion.next)} kg</b></div><div>${esc(suggestion.reason)}</div><small>${suggestion.lastSummary?`Ultima: ${esc(suggestion.lastSummary)} · `:''}${suggestion.historyCount} sedute utili · confidenza ${esc(suggestion.confidence)}</small></div>`:''}<div class="chart-wrap"><canvas id="progressChart"></canvas></div><div class="subtle" style="margin-top:8px">Grafico: ${progressMetricLabel(metric,assisted)} per sessione. ${assisted?'Per gli esercizi assistiti meno kg di assistenza significa progresso; e1RM è disattivato.':isBench?'La vista globale combina Panca A, Panca B, singole, back-off e fermo; e1RM usa reps + RIR/RPE.':'e1RM con formula Epley sui set fino a 12 ripetizioni.'} Serie registrate: ${totalSets}.</div></section>`;
  if(data.length<2)c+=`<div class="empty"><b>Servono almeno 2 sessioni</b>Il trend diventa utile dopo qualche allenamento registrato.</div>`;
  setTimeout(()=>drawProgressChart(data,metric),0); return shell(c,'Progressi','carichi, volume e trend');
}
function drawProgressChart(data,metric=state.ui.progressMetric||'e1rm'){
  const canvas=$('#progressChart');if(!canvas)return;const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.max(1,rect.width*dpr);canvas.height=Math.max(1,rect.height*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const w=rect.width,h=rect.height,pad=34;ctx.clearRect(0,0,w,h);ctx.font='11px -apple-system, sans-serif';ctx.strokeStyle='#263241';ctx.fillStyle='#93a4b8';ctx.lineWidth=1;
  const usable=data.map(d=>({...d,value:progressMetricValue(d,metric)})).filter(d=>d.value>0);if(!usable.length){ctx.fillText('Nessun dato',pad,h/2);return;}const vals=usable.map(x=>x.value);let min=Math.min(...vals),max=Math.max(...vals);if(min===max){const margin=Math.max(1,max*.05);min-=margin;max+=margin;}const y=v=>h-pad-(v-min)/(max-min)*(h-pad*2);const x=i=>usable.length===1?w/2:pad+i*(w-pad*2)/(usable.length-1);
  for(let i=0;i<4;i++){const yy=pad+i*(h-pad*2)/3;ctx.beginPath();ctx.moveTo(pad,yy);ctx.lineTo(w-pad,yy);ctx.stroke();const val=max-i*(max-min)/3;ctx.fillText(metric==='volume'?Math.round(val):val.toFixed(0),4,yy+4);}
  ctx.strokeStyle='#7ee787';ctx.lineWidth=2.5;ctx.beginPath();usable.forEach((d,i)=>{const xx=x(i),yy=y(d.value);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)});ctx.stroke();ctx.fillStyle='#7ee787';usable.forEach((d,i)=>{ctx.beginPath();ctx.arc(x(i),y(d.value),4,0,Math.PI*2);ctx.fill();});ctx.fillStyle='#93a4b8';const step=Math.max(1,Math.ceil(usable.length/4));usable.forEach((d,i)=>{if(i%step===0||i===usable.length-1)ctx.fillText(fmtDateShort(d.date),Math.max(2,x(i)-14),h-8);});
}

function renderSettings(){
  const p=activeProgram(), imported=!!state.activeProgram, lib=state.programLibrary||[];
  let c=`<section class="card"><h2 style="margin-top:0">Durante l'allenamento</h2>${settingToggle('smartLoad','Carichi consigliati intelligenti','Usa storico, range reps e RIR/RPE per proporre il prossimo carico.')}${settingToggle('autoTimer','Timer automatico','Parte quando confermi una serie.')}${settingToggle('vibrate','Vibrazione','Segnale al termine del recupero.')}${settingToggle('wakeLock','Schermo sempre acceso','Se supportato dal browser, evita lo spegnimento durante la sessione.')}${settingToggle('showRir','Mostra RIR / RPE','Permette di modificare la percezione dello sforzo serie per serie.')}</section>`;
  c+=`<section class="card"><div class="row between"><div><h2 style="margin:0">Scheda allenamento</h2><div class="subtle">${esc(programTitle())} · ${imported?'personalizzata':'originale'}</div></div><span class="badge ${imported?'green':''}">${imported?'CUSTOM':'BASE'}</span></div><p class="subtle">Il pacchetto portabile contiene scheda + storico: reimportandolo su un altro dispositivo ritrovi progressioni e carichi consigliati. Il JSON semplice esporta solo la struttura della scheda.</p><div class="action-stack"><button class="primary-btn" onclick="exportPortableProgram()">Esporta scheda + storico</button><button class="secondary-btn" onclick="exportProgram()">Esporta solo scheda</button><button class="secondary-btn" onclick="triggerProgramImport()">Importa scheda / pacchetto</button>${imported?`<button class="secondary-btn" onclick="saveActiveProgramToLibrary()">Salva scheda in libreria</button><button class="secondary-btn" onclick="restoreDefaultProgram()">Torna alla scheda originale</button>`:''}</div></section>`;
  c+=`<section class="card"><div class="row between"><div><h2 style="margin:0">Libreria schede</h2><div class="subtle">${lib.length} schede salvate · lo storico è unico e resta separato</div></div><span class="badge">LIBRERIA</span></div>${lib.length?`<div class="program-library">${lib.map(item=>`<div class="program-library-row"><div><b>${esc(item.title)}</b><small>salvata ${fmtDateShort(item.savedAt)}</small></div><div><button onclick="activateLibraryProgram(decodeURIComponent('${encodedArg(item.id)}'))">Attiva</button><button class="danger-mini" onclick="removeLibraryProgram(decodeURIComponent('${encodedArg(item.id)}'))">×</button></div></div>`).join('')}</div>`:`<div class="empty compact"><b>Nessuna scheda salvata</b>Importa una scheda o salva quella attiva.</div>`}</section>`;
  c+=`<section class="card"><h2 style="margin-top:0">Storico e backup</h2><div class="data-status"><span><b>${state.history.length}</b><small>sessioni</small></span><span><b>${allExerciseNames().length}</b><small>esercizi</small></span><span><b>v${APP_VERSION}</b><small>formato dati</small></span></div><div class="action-stack"><button class="secondary-btn" onclick="exportCSV()">Esporta storico CSV</button><button class="secondary-btn" onclick="triggerCSVImport()">Importa / unisci CSV storico</button><button class="secondary-btn" onclick="exportBackup()">Esporta backup completo JSON</button><button class="secondary-btn" onclick="triggerImport()">Ripristina backup completo</button><button class="danger-btn" onclick="resetAll()">Azzera tutti i dati</button></div><p class="subtle" style="margin-bottom:0">L'import CSV è non distruttivo: le sessioni già presenti vengono riconosciute e saltate.</p></section>`;
  const stepExercises=[];for(const w of Object.values(p.workouts||{}))for(const raw of w.exercises||[]){const ex=ensureExerciseIdentity(raw);if(!ex.special&&Number(ex.sets)>0&&!stepExercises.some(x=>effectiveExerciseId(x)===effectiveExerciseId(ex)))stepExercises.push(ex);}c+=`<section class="card"><div class="row between"><div><h2 style="margin:0">Step carichi personalizzati</h2><div class="subtle">Imposta lo scatto reale di ogni macchina/manubrio. Se lasci vuoto, l’app usa lo storico e il tipo di attrezzatura.</div></div><span class="badge">SMART LOAD</span></div><div class="load-step-list">${stepExercises.map(ex=>{const id=effectiveExerciseId(ex),custom=state.exerciseSettings?.[id]?.loadStepKg;return `<div class="load-step-row"><div><b>${esc(ex.name)}</b><small>automatico: ${fmtKg(inferredLoadStepFor(ex))} kg</small></div><div class="load-step-control"><input class="num-input" type="number" inputmode="decimal" step="0.5" min="0.5" value="${custom??''}" placeholder="auto" onchange="setExerciseLoadStep(decodeURIComponent('${encodedArg(id)}'),this.value)">${custom?`<button onclick="resetExerciseLoadStep(decodeURIComponent('${encodedArg(id)}'))">×</button>`:''}</div></div>`}).join('')}</div></section>`;
  const eq=Array.isArray(p.equipment)?p.equipment:[];c+=`<section class="card"><div class="row between"><div><h2 style="margin:0">Attrezzatura palestra</h2><div class="subtle">${eq.length} voci disponibili</div></div><span class="badge green">GYM</span></div><div style="margin-top:10px">${eq.map(x=>`<div class="setting-row"><div><h4>${esc(x)}</h4></div><span class="green">✓</span></div>`).join('')}</div></section>`;
  c+=`<section class="card install-banner"><h2 style="margin-top:0">Installazione</h2><p class="subtle">La versione PWA funziona offline dopo il primo caricamento quando viene pubblicata tramite HTTPS.</p><button class="primary-btn" onclick="installApp()">Istruzioni installazione</button></section>`;
  c+=`<div class="app-version">Gym Tracker v${APP_VERSION} · local-first · storico portabile · nessun account richiesto</div>`;
  return shell(c,'Altro','schede, storico e backup');
}
function settingToggle(k,title,desc){ return `<div class="setting-row"><div><h4>${title}</h4><p>${desc}</p></div><button class="toggle ${state.settings[k]?'on':''}" onclick="toggleSetting('${k}')" aria-label="${title}"><i></i></button></div>`; }

function render(){
  const app=$('#app'); if(!app)return;
  try{
    let html='';
    switch(state.ui.view){case'program':html=renderProgram();break;case'history':html=renderHistory();break;case'progress':html=renderProgress();break;case'settings':html=renderSettings();break;case'session':html=renderSession();break;default:html=renderHome();}
    app.innerHTML=html; renderTimer(); updateElapsed();
  }catch(e){
    console.error('Errore di rendering', e);
    app.innerHTML=`<section class="card"><h2 style="margin-top:0">Si è verificato un errore</h2><p class="subtle">La schermata non si è potuta visualizzare correttamente. I tuoi dati restano salvati: puoi esportare un backup per sicurezza e poi ricaricare l'app.</p><div class="action-stack"><button class="primary-btn" onclick="exportBackup()">Esporta backup</button><button class="secondary-btn" onclick="location.reload()">Ricarica</button></div></section>`;
  }
}
function updateElapsed(){ const el=$('#elapsedTime');if(!el||!state.currentSession)return;el.textContent=fmtTime((Date.now()-new Date(state.currentSession.startedAt))/1000); }
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;render();});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;toast('App installata');render();});
window.addEventListener('resize',()=>{if(state.ui.view==='progress')drawProgressChart(progressData(state.ui.progressExercise),state.ui.progressMetric);});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.settings.wakeLock&&state.currentSession)requestWakeLock();});
$('#importInput')?.addEventListener('change',async e=>{
  const file=e.target.files?.[0];if(!file)return;
  try{
    const parsed=JSON.parse(await file.text()), incoming=parsed.state||parsed;
    if(!incoming.history||!Array.isArray(incoming.history))throw new Error('history');
    if(!confirm(`Ripristinare il backup con ${incoming.history.length} sessioni? I dati attuali verranno sostituiti.`))return;
    state={...clone(defaultState),...incoming,version:APP_VERSION,activeProgram:incoming.activeProgram?.workouts?incoming.activeProgram:null,programLibrary:Array.isArray(incoming.programLibrary)?incoming.programLibrary.filter(x=>x&&x.program?.workouts):[],history:incoming.history,ui:{...defaultState.ui,...(incoming.ui||{})},settings:{...defaultState.settings,...(incoming.settings||{})},exerciseSettings:{...(incoming.exerciseSettings||{})}};
    state.history.sort((a,b)=>new Date(b.startedAt||0)-new Date(a.startedAt||0));state.currentWeek=clamp(Number(state.currentWeek)||1,1,programWeekCount());saveState();render();toast('Backup ripristinato');
  }catch{toast('File backup non valido');}
  e.target.value='';
});
$('#csvInput')?.addEventListener('change',async e=>{
  const file=e.target.files?.[0];if(!file)return;
  try{const incoming=historyFromCSV(await file.text()), result=mergeHistory(incoming);saveState();render();toast(result.added||result.updated?`${result.added} nuove · ${result.updated} aggiornate · ${result.skipped} già complete`:`Nessuna nuova sessione · ${result.skipped} già presenti`);}catch(err){console.warn(err);toast('CSV storico non riconosciuto');}
  e.target.value='';
});
$('#programInput')?.addEventListener('change',async e=>{
  const file=e.target.files?.[0];if(!file)return;
  try{
    if(state.currentSession) throw new Error('sessione');
    const parsed=JSON.parse(await file.text()), isPackage=parsed?.type==='gym-tracker-program-package'||(parsed?.program?.workouts&&Array.isArray(parsed?.history));
    const program=normalizeProgram(parsed?.program||parsed), workouts=program.splitOrder.length, exercises=Object.values(program.workouts).reduce((n,w)=>n+w.exercises.length,0), incomingHistory=isPackage&&Array.isArray(parsed.history)?parsed.history:[];
    const historyText=incomingHistory.length?` Il pacchetto contiene anche ${incomingHistory.length} sessioni, che verranno unite senza duplicati.`:` Lo storico attuale (${state.history.length} sessioni) resterà intatto.`;
    if(!confirm(`Importare la scheda “${program.title}” (${workouts} sedute, ${exercises} esercizi)?${historyText}`))return;
    state.activeProgram=saveProgramToLibrary(program);let merged={added:0,skipped:0,updated:0};if(incomingHistory.length)merged=mergeHistory(incomingHistory);
    if(isPackage&&parsed.settings?.smartLoad!==undefined)state.settings.smartLoad=!!parsed.settings.smartLoad;if(isPackage&&parsed.exerciseSettings&&typeof parsed.exerciseSettings==='object')state.exerciseSettings={...state.exerciseSettings,...parsed.exerciseSettings};
    state.version=APP_VERSION;state.currentWeek=clamp(Number(parsed.currentWeek||program.startWeek)||1,1,programWeekCount());state.preCycleStep=clamp(Number(parsed.preCycleStep)||0,0,preCycleCount());state.weekStartedAt=parsed.weekStartedAt||new Date().toISOString();state.pendingWeekAdvance=null;state.ui.view='program';state.ui.openExercise=0;saveState();render();toast(incomingHistory.length?`Scheda importata · ${merged.added} nuove · ${merged.updated} aggiornate`:'Nuova scheda importata');
  }catch(err){console.warn(err);toast(err?.message==='sessione'?'Termina la sessione prima di cambiare scheda':'File scheda non valido');}
  e.target.value='';
});
if('serviceWorker' in navigator && location.protocol!=='file:') window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}));
try{const requested=new URLSearchParams(location.search).get('view');if(['home','program','history','progress','settings'].includes(requested))state.ui.view=requested;}catch(e){}
setInterval(()=>{renderTimer();updateElapsed();},500);
render();
