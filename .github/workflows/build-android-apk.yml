name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Gym Tracker Android
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify repository consistency
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle
          test -f settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f app.js
          test -f data.js
          test -f version.js
          grep -q "com.android.tools.build:gradle:8.7.3" build.gradle
          grep -q "versionName '9.2.1'" android/app/build.gradle
          grep -q "APP_VERSION = '9.2.1'" version.js
          grep -q "Gym Tracker v9.2.1" app.js
          grep -q '"pushTop": "147,5 kg x 1 @8"' data.js
          echo "Repository v9.2.1 coerente."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;35.0.0|platform-tools" || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk GymTracker-v9.2.1.apk
          ls -lh GymTracker-v9.2.1.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: GymTracker-v9.2.1.apk
          path: GymTracker-v9.2.1.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
