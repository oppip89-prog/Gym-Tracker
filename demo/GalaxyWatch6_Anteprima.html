<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gym Tracker 9.5 - Galaxy Watch 6 | Anteprima</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101820;color:#f5f7fc;font:16px system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:16px}main{display:flex;flex-direction:column;align-items:center;gap:20px;width:min(100%,520px)}h1{font-size:20px;text-align:center;margin:0}p{color:#aab9cc;font-size:13px;text-align:center;line-height:1.5;margin:0 18px}small{color:#8999ac}button{font:inherit;cursor:pointer}section.watch{background:#05080e;border:12px solid #313a48;outline:2px solid #556171;border-radius:50%;width:min(90vw,386px);aspect-ratio:1;box-shadow:0 22px 45px #0008;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}section.watch:after{content:"";position:absolute;pointer-events:none;inset:8px;border-radius:50%;border:1px solid #626b7b3a}.inside{width:76%;height:81%;overflow:auto;text-align:center;scrollbar-width:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0}.inside::-webkit-scrollbar{display:none}.brand{letter-spacing:.12em;text-transform:uppercase;color:#ffd403;font-weight:800;font-size:11px}.status{font-size:10px;color:#55d7aa;margin:2px 0 6px}.name{font-size:17px;font-weight:750;line-height:1.1;margin:2px}.detail{font-size:11px;color:#a7b5c9}.label{font-size:10px;letter-spacing:.08em;color:#a7b5c9;margin-top:5px}.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}.controls button{flex:0 0 40px;height:36px;border-radius:50%;background:#202d3a;color:white;border:0;font-weight:700;font-size:22px}.value{font-weight:750;font-size:23px;white-space:nowrap}.action{background:#ffd403;color:#101820;border:0;border-radius:40px;padding:10px 14px;font-size:12px;font-weight:800;width:100%;margin-top:7px}.soft{border:0;border-radius:30px;padding:10px 14px;background:#1c2a38;color:white;font-weight:700;font-size:13px}.time{font-size:35px;font-weight:800;color:#ffd403;margin:12px 0}.big{font-size:42px;font-weight:800;color:#55d7aa}.nav{display:flex;gap:10px;justify-content:center}.nav button{background:#293746;color:white;border:1px solid #556270;border-radius:24px;padding:10px 15px;font-size:13px;font-weight:650}.foot{font-size:10px;color:#a7b5c9;margin-top:auto}.hint{max-width:450px}.doc{color:#ffd403}
</style></head><body><main><h1>Gym Tracker 9.5 | Galaxy Watch 6</h1><p><b>Anteprima interattiva</b>: prova i comandi e le pagine. Non si collega ancora al telefono e non legge dati reali.</p>
<section class="watch"><div class="inside" id="screen"></div></section>
<div class="nav"><button onclick="go(-1)">&larr; Indietro</button><button onclick="go(1)">Avanti &rarr;</button></div>
<p class="hint">Nell'app vera potrai scorrere lateralmente per passare fra Serie, Recupero, Battito, Calorie e Riepilogo. I carichi qui sono dimostrativi.</p></main>
<script>
let page=0, kg=125, reps=3, done=1, total=6, end=0;const titles=['SERIE','RECUPERO','BATTITO','CALORIE','RIEPILOGO'];
let startX=0;
const box=document.querySelector('.watch');box.addEventListener('touchstart',e=>startX=e.touches[0].clientX);box.addEventListener('touchend',e=>{let x=e.changedTouches[0].clientX-startX;if(Math.abs(x)>50)go(x<0?1:-1)});
function go(d){page=(page+d+5)%5;render()}
function clock(v){return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
function remaining(){return Math.max(0,Math.ceil((end-Date.now())/1000))}
function header(){return `<div class="brand">GYM TRACKER</div><div class="status">\u25cf Demo di interfaccia</div>`}
function foot(){return `<div class="foot">${page+1}/5 \u00a0 ${titles[page]}</div>`}
function render(){let h=header();if(page===0){h+=`<div class="detail">PUSH \u00b7 Settimana 3</div><div class="name">Panca piana</div><div class="detail">Serie ${Math.min(done+1,total)} di ${total}</div><div class="label">CARICO</div><div class="controls"><button onclick="kg=Math.max(0,kg-2.5);render()">-</button><span class="value">${kg.toLocaleString('it-IT')} kg</span><button onclick="kg+=2.5;render()">+</button></div><div class="label">RIPETIZIONI</div><div class="controls"><button onclick="reps=Math.max(1,reps-1);render()">-</button><span class="value">${reps}</span><button onclick="reps+=1;render()">+</button></div><button class="action" onclick="confirm()">CONFERMA SERIE</button><div class="detail">Recupero ${clock(remaining())}</div>`;}else if(page===1){h+=`<div class="name">Recupero</div><div class="time" id="timer">${clock(remaining())}</div><div class="controls"><button class="soft" onclick="end=Math.max(end,Date.now())+30000;render()">+30 s</button><button class="soft" onclick="end=0;render()">Salta</button></div><div class="detail">Vibrazione a fine recupero sul Watch</div>`;}else if(page===2){h+=`<div class="name">Battito cardiaco</div><div class="big">--</div><div class="detail">BPM</div><div class="detail" style="margin-top:12px">Il dato reale richiede il sensore e il permesso sul Galaxy Watch.</div>`;}else if(page===3){h+=`<div class="name">Calorie attive</div><div class="big">--</div><div class="detail">kcal</div><div class="detail" style="margin-top:12px">Pagina predisposta per Health Services. Lettura non attiva nella prima versione.</div>`;}else{h+=`<div class="name">PUSH</div><div class="big">${done}/${total}</div><div class="detail">Serie confermate (demo)</div><div class="detail" style="margin-top:10px">FitActive Borgaro</div>`;}document.getElementById('screen').innerHTML=h+foot()}
function confirm(){if(done<total){done++;end=Date.now()+4*60000;render();}else{page=4;render();}}
setInterval(()=>{if(remaining()>0){const t=document.getElementById('timer');if(t)t.textContent=clock(remaining());}},450);render();
</script></body></html>
